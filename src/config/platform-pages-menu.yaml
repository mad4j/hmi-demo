pages:
  - id: menu
    label: Menu
    icon: "menu"
    submenus:
      - id: test
        label: TEST
        parameters:
          - id: POST
            name: POST
            type: number
            unit: ""
            precision: 1
          - id: IBIT
            name: IBIT
            type: number
            unit: ""
            precision: 1
          - id: CBIT
            name: CBIT
            type: number
            unit: ""
            precision: 1
            readonly: true
          - id: TEST REPORT
            name: TEST REPORT
            type: number
            precision: 0
      - id: gnss
        label: GNSS
        panels:
          - label: GNSS 
            parameters:
              - id: GNSS Time
                name: GNSS Time
                type: boolean
              - id: GNSS Configuration
                name: GNSS Configuration
                type: boolean
          - label: SA
            parameters:
              - id: SA Configuration
                name: SA Configuration
                type: boolean
      - id: audio_vocoder
        label: Audio/Vocoder
        panels:
          - label: Audio 
            parameters:
              - id: General
                name: General
                type: boolean
              - id: General Audio Channel
                name: General Audio Channel
                type: boolean
              - id: Automatic Volume Control
                name: Automatic Volume Control
                type: boolean
          - label: Vocoder
            parameters:
              - id: Vocoder Status
                name: Vocoder Status
                type: boolean      
              - id: Payload Control
                name: Payload Control
                type: boolean   
      - id: serial
        label: SERIAL
        parameters:
            - id: SERIAL PORT STATUS
              name: SERIAL PORT STATUS
              type: number
              unit: ""
              precision: 1
            - id: GENERAL CONFIG
              name:  GENERAL CONFIG
              type: number
              unit: ""
              precision: 1
            - id: SERIAL OVER IP CONFIG
              name: SERIAL OVER IP CONFIG
              type: number
              unit: ""
              precision: 1
              readonly: true
            - id: PAYLOAD CONTROL
              name: PAYLOAD CONTROL
              type: number
              precision: 0   
            - id: Bit_Error_Rate
              label: Bit Error Rate
              panels: 
              - label: BER CONFIG 
                parameters:
                  - id: BER CONFIG
                    name: BER CONFIG
                    type: number
                    unit: ""
                    precision: 1
              - label: BER RESULT 
                parameters:
                - id: BER RESULT
                  name: BER RESULT
                  type: number
                  precision: 0  

      - id: USER CONFIG
        label: USER CONFIG
