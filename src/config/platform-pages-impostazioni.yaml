pages:
  - id: impostazioni
    label: Settings
    icon: "settings"
    parameters: []
    submenus:
      - id: tema
        label: Theme
        icon: "theme"
        parameters: []
      - id: screen
        label: Screen
        icon: "settings"
        parameters: []
      - id: login
        label: Login
        icon: "login"
        mode: transaction
        goOnApply: GO_BACK
        parameters:
          - id: login_name
            name: Name
            type: text
            clearOnApply: true
          - id: login_password
            name: Password
            type: password
            clearOnApply: true
      - id: logout
        label: Logout
        icon: "lock"
        visibility: hidden
        goOnApply: STAY_HERE
        parameters: []
      - id: Report
        label: Report
        panels:
        - label: LogFile
          parameters:
            - id: LogFile
              name: LogFile
              type: boolean
        - label: FaultLogFile
          parameters:
            - id: FaultLogFile
              name: FaultLogFile
              type: boolean
        - label: AuditFile
          parameters:
            - id: AuditFile
              name: AuditFile
              type: boolean
        - label: CSSFile
          parameters:
            - id: CSSFile
              name: CSSFile
              type: boolean
      - id: waveform-XCVR
        label: XCVR
        icon: "settings"
        parameters:
          - id: XCVR
            name: XCVR
            type: enum
            options: [NATO-BASELINE, NAZ-OPS, TRAINING, EMERGENCY, CUSTOM-1, CUSTOM-2]
            readonly: false
         
                        
        
      
      

      